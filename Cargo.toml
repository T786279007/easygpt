[package]
name = "chatgpt_webview_client"
version = "0.1.0"
edition = "2024"
description = "A lightweight ChatGPT desktop client using Rust, Wry, and WebView2."

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
directories = "6.0.0"
reqwest = { version = "0.13.3", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
tao = "0.35.3"
toml = "1.1.2"
urlencoding = "2.1.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = "0.55.1"

[target."cfg(windows)".dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"
