<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Web Client Top Switcher Prototype</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-muted: #f0f2f5;
      --line: #d9dde3;
      --line-strong: #a8b0bd;
      --text: #15181d;
      --muted: #687080;
      --accent: #1769e0;
      --accent-soft: #e8f1ff;
      --ok: #0b7a3b;
      --warn: #9a6500;
      --shadow: 0 14px 42px rgba(20, 26, 35, .16);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr);
      height: 100vh;
      min-width: 720px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .94);
      padding: 8px 12px;
      backdrop-filter: blur(14px);
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      overflow: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      display: inline-grid;
      grid-template-columns: auto minmax(0, auto) auto;
      align-items: center;
      gap: 7px;
      min-width: 116px;
      height: 36px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab:hover {
      background: var(--surface-muted);
      color: var(--text);
    }

    .tab[data-active="true"] {
      border-color: var(--line);
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 4px 14px rgba(22, 31, 45, .08);
    }

    .tab-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--line-strong);
    }

    .tab[data-started="true"] .tab-dot {
      background: var(--ok);
    }

    .tab-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-shortcut {
      color: var(--muted);
      font-size: 11px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .top-status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-right: 4px;
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--line);
      margin: 0 4px;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    .icon-btn:hover {
      border-color: var(--line-strong);
      background: var(--surface-muted);
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .workspace {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.72), rgba(245,246,248,.94)),
        radial-gradient(circle at 18% 10%, rgba(23,105,224,.10), transparent 26%),
        radial-gradient(circle at 85% 15%, rgba(11,122,59,.08), transparent 24%);
    }

    .page {
      position: absolute;
      inset: 0;
      display: none;
      padding: 14px;
    }

    .page[data-active="true"] {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .76);
      padding: 0 10px;
      color: var(--muted);
    }

    .pill strong {
      color: var(--text);
      font-weight: 650;
    }

    .surface {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .webview-mock {
      display: grid;
      grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
      gap: 0;
      min-height: 0;
    }

    .mock-sidebar {
      border-right: 1px solid var(--line);
      background: #fbfcfd;
      padding: 14px;
    }

    .mock-sidebar-title {
      margin: 0 0 12px;
      font-weight: 700;
    }

    .mock-list {
      display: grid;
      gap: 8px;
    }

    .mock-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      color: var(--muted);
    }

    .mock-item[data-current="true"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text);
    }

    .mock-main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
      padding: 18px;
      min-width: 0;
      min-height: 0;
    }

    .mock-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .mock-title h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .mock-card {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px;
    }

    .mock-card label {
      color: var(--muted);
      font-weight: 650;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      padding: 12px;
      color: var(--text);
      background: #fbfcfd;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 105, 224, .14);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--line);
      background: #fbfcfd;
      padding: 10px 12px;
      color: var(--muted);
    }

    .settings-fab {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 30;
      box-shadow: 0 10px 28px rgba(20, 26, 35, .18);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      place-items: center;
      background: rgba(17, 24, 39, .38);
      padding: 20px;
    }

    .modal-backdrop[data-open="true"] {
      display: grid;
    }

    .modal {
      width: min(620px, calc(100vw - 40px));
      max-height: min(720px, calc(100vh - 40px));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .28);
      overflow: hidden;
    }

    .modal-head,
    .modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
    }

    .modal-head {
      border-bottom: 1px solid var(--line);
    }

    .modal-foot {
      border-top: 1px solid var(--line);
      background: #fbfcfd;
    }

    .modal h2 {
      margin: 0;
      font-size: 16px;
    }

    .modal-body {
      display: grid;
      gap: 12px;
      overflow: auto;
      padding: 14px;
    }

    .setting-row {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-height: 38px;
    }

    .setting-row strong {
      font-weight: 650;
    }

    .select-like {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px 10px;
      color: var(--text);
    }

    .primary-btn,
    .secondary-btn {
      min-height: 34px;
      border-radius: 8px;
      padding: 0 12px;
      cursor: pointer;
    }

    .primary-btn {
      border: 1px solid #111827;
      background: #111827;
      color: #fff;
    }

    .secondary-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
    }

    @media (max-width: 820px) {
      body {
        overflow: auto;
      }

      .app {
        min-width: 0;
        height: auto;
        min-height: 100vh;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: flex-start;
        flex-wrap: wrap;
      }

      .page {
        padding: 14px;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .webview-mock {
        grid-template-columns: 1fr;
      }

      .mock-sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .setting-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <nav class="tabs" aria-label="AI pages">
        <button class="tab" type="button" data-site="chatgpt" data-active="true" data-started="true">
          <span class="tab-dot"></span>
          <span class="tab-name">ChatGPT</span>
          <span class="tab-shortcut">1</span>
        </button>
        <button class="tab" type="button" data-site="gemini" data-active="false" data-started="false">
          <span class="tab-dot"></span>
          <span class="tab-name">Gemini</span>
          <span class="tab-shortcut">2</span>
        </button>
        <button class="tab" type="button" data-site="notebooklm" data-active="false" data-started="false">
          <span class="tab-dot"></span>
          <span class="tab-name">NotebookLM</span>
          <span class="tab-shortcut">3</span>
        </button>
        <button class="tab" type="button" data-site="aistudio" data-active="false" data-started="false">
          <span class="tab-dot"></span>
          <span class="tab-name">Google AI Studio</span>
          <span class="tab-shortcut">4</span>
        </button>
      </nav>

      <div class="actions" aria-label="Page actions">
        <div class="top-status" aria-label="Current status">
          <span class="pill"><strong>已登录</strong></span>
          <span class="pill"><strong>代理可用</strong> 86 ms</span>
          <span class="pill"><strong>页面常驻</strong></span>
        </div>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="icon-btn" type="button" title="后退" aria-label="后退">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <button class="icon-btn" type="button" title="前进" aria-label="前进">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
        <button class="icon-btn" type="button" title="刷新" aria-label="刷新" data-action="refresh">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 4v6h-6"></path></svg>
        </button>
      </div>
    </header>

    <main class="workspace" id="workspace">
    </main>
  </div>

  <button class="icon-btn settings-fab" type="button" title="设置" aria-label="设置" data-action="settings">
    <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.35 1.05V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8.6 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1.05-.35H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6A1.65 1.65 0 0 0 10.35 3V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15.4 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.3.38.75.6 1.24.6H21a2 2 0 0 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15z"></path></svg>
  </button>

  <div class="modal-backdrop" id="settings-modal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="modal-head">
        <h2 id="settings-title">应用设置</h2>
        <button class="icon-btn" type="button" title="关闭" aria-label="关闭" data-action="close-settings">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
      </header>
      <div class="modal-body">
        <div class="setting-row">
          <strong>代理模式</strong>
          <div class="select-like">内置 Clash，应用内生效</div>
        </div>
        <div class="setting-row">
          <strong>当前订阅</strong>
          <div class="select-like">zjtxs test subscription</div>
        </div>
        <div class="setting-row">
          <strong>当前节点</strong>
          <div class="select-like">Proxy / DO-VLESS / 86 ms</div>
        </div>
        <div class="setting-row">
          <strong>启动页面</strong>
          <div class="select-like" id="settings-active-page">ChatGPT</div>
        </div>
      </div>
      <footer class="modal-foot">
        <span>配置保存到程序目录 data</span>
        <div class="actions">
          <button class="secondary-btn" type="button" data-action="close-settings">关闭</button>
          <button class="primary-btn" type="button" data-action="close-settings">保存</button>
        </div>
      </footer>
    </section>
  </div>

  <script>
    const sites = {
      chatgpt: {
        title: 'ChatGPT',
        url: 'https://chatgpt.com',
        sidebarTitle: '最近对话',
        items: ['产品规划', '代码排查', '文档整理'],
        note: '这里模拟 ChatGPT 页面。切换到其他页面再回来，输入内容会保留。'
      },
      gemini: {
        title: 'Gemini',
        url: 'https://gemini.google.com',
        sidebarTitle: 'Gemini 工作区',
        items: ['快速问答', '图片理解', '长文分析'],
        note: '这里模拟 Gemini 页面。真实版本会打开独立 WebView。'
      },
      notebooklm: {
        title: 'NotebookLM',
        url: 'https://notebooklm.google.com',
        sidebarTitle: '笔记本',
        items: ['项目资料', '会议纪要', '研究摘录'],
        note: '这里模拟 NotebookLM 页面，并保留当前笔记状态。'
      },
      aistudio: {
        title: 'Google AI Studio',
        url: 'https://aistudio.google.com',
        sidebarTitle: '实验',
        items: ['Prompt Lab', '模型测试', 'API Key'],
        note: '这里模拟 Google AI Studio 页面。'
      }
    };

    const state = {
      activeSite: 'chatgpt',
      startedSites: new Set(['chatgpt']),
      notes: Object.fromEntries(Object.entries(sites).map(([key, site]) => [key, site.note]))
    };

    const workspace = document.getElementById('workspace');
    const modal = document.getElementById('settings-modal');
    const activePageSetting = document.getElementById('settings-active-page');

    function iconPath(siteKey) {
      const labels = {
        chatgpt: 'C',
        gemini: 'G',
        notebooklm: 'N',
        aistudio: 'AI'
      };
      return labels[siteKey] || 'AI';
    }

    function ensurePage(siteKey) {
      let page = document.querySelector(`.page[data-page="${siteKey}"]`);
      if (page) return page;

      const site = sites[siteKey];
      page = document.createElement('section');
      page.className = 'page';
      page.dataset.page = siteKey;
      page.innerHTML = `
        <div class="surface">
          <div class="webview-mock">
            <aside class="mock-sidebar">
              <p class="mock-sidebar-title">${site.sidebarTitle}</p>
              <div class="mock-list">
                ${site.items.map((item, index) => `<div class="mock-item" data-current="${index === 0}">${item}</div>`).join('')}
              </div>
            </aside>
            <section class="mock-main">
              <div class="mock-title">
                <h2>${site.title} 页面</h2>
                <span class="pill"><strong>${iconPath(siteKey)}</strong> active</span>
              </div>
              <div class="mock-card">
                <label for="note-${siteKey}">页面状态</label>
                <textarea id="note-${siteKey}" spellcheck="false">${state.notes[siteKey]}</textarea>
              </div>
            </section>
          </div>
        </div>
      `;

      page.querySelector('textarea').addEventListener('input', event => {
        state.notes[siteKey] = event.target.value;
      });

      workspace.appendChild(page);
      return page;
    }

    function switchSite(siteKey) {
      if (!sites[siteKey]) return;
      state.startedSites.add(siteKey);
      state.activeSite = siteKey;
      ensurePage(siteKey);
      render();
    }

    function render() {
      document.querySelectorAll('.tab').forEach(tab => {
        const siteKey = tab.dataset.site;
        tab.dataset.active = String(siteKey === state.activeSite);
        tab.dataset.started = String(state.startedSites.has(siteKey));
      });

      document.querySelectorAll('.page').forEach(page => {
        page.dataset.active = String(page.dataset.page === state.activeSite);
      });

      activePageSetting.textContent = sites[state.activeSite].title;
    }

    function openSettings() {
      modal.dataset.open = 'true';
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeSettings() {
      modal.dataset.open = 'false';
      modal.setAttribute('aria-hidden', 'true');
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => switchSite(tab.dataset.site));
    });

    document.querySelectorAll('[data-action="settings"]').forEach(button => {
      button.addEventListener('click', openSettings);
    });

    document.querySelectorAll('[data-action="close-settings"]').forEach(button => {
      button.addEventListener('click', closeSettings);
    });

    document.querySelector('[data-action="refresh"]').addEventListener('click', () => {
      const siteKey = state.activeSite;
      const textarea = document.getElementById(`note-${siteKey}`);
      if (textarea) {
        textarea.focus();
      }
    });

    modal.addEventListener('click', event => {
      if (event.target === modal) closeSettings();
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeSettings();
      if (event.altKey && ['1', '2', '3', '4'].includes(event.key)) {
        const siteKey = ['chatgpt', 'gemini', 'notebooklm', 'aistudio'][Number(event.key) - 1];
        switchSite(siteKey);
      }
    });

    ensurePage('chatgpt');
    render();
  </script>
</body>
</html>
