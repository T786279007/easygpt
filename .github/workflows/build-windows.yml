name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Verify Rust formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Windows packages
        shell: pwsh
        run: .\scripts\package-installer.ps1 -TargetDir target_ci

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target_ci\artifacts | Out-Null
          Compress-Archive `
            -Path target_ci\installer_staging\portable\EasyGPT\* `
            -DestinationPath target_ci\artifacts\EasyGPT-windows-x64-portable.zip `
            -Force
          Copy-Item `
            -Path target_ci\installer\EasyGPT-windows-x64-Setup-*.exe `
            -Destination target_ci\artifacts `
            -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easygpt-windows-x64
          path: target_ci/artifacts/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify Rust formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build macOS packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/package-macos.sh --target-dir target_ci_macos --arch ${{ matrix.arch }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easygpt-macos-${{ matrix.arch }}
          path: target_ci_macos/artifacts/*
          if-no-files-found: error

  linux:
    name: Linux x64 package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            gzip \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify Rust formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Linux packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/package-linux.sh --target-dir target_ci_linux --arch x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easygpt-linux-x64
          path: target_ci_linux/artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - windows
      - macos
      - linux
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create checksums
        run: |
          find release-artifacts -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release-artifacts/SHA256SUMS.txt
          cat release-artifacts/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.zip
            release-artifacts/**/*.dmg
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.deb
            release-artifacts/SHA256SUMS.txt
